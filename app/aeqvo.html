<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[ æqvo ]</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 20px; background: #616462; color: #333; }
        .app { width:1024px; font-size:11px; background-color: #eee;}
        .groups { display:flex; background-color: #000000;}
        .controls { padding: 5px; margin-bottom: 0px; display: flex; gap: 20px; flex-wrap: wrap; align-items: baseline; flex:2; }
        
        .input-group { display: flex; flex-direction: column; }
        .checkbox-group { display: flex; align-items: center; gap: 15px; padding-bottom: 0px; }
        .checkbox-item { display: flex; align-items: center; gap: 5px; font-size: 0.9em; cursor: pointer; }
        
        label { font-weight: bold; margin-bottom: 5px; font-size: 0.85em; text-transform: uppercase; color: #aaa; }
        input[type="number"] { padding: 0px; width: 40px; border-radius: none; font-weight: bold; font-family: monospace; color:black; background-color: #798e77; padding-left:3px;text-shadow: 0 0 black; }
        
        .info-panel { display: flex; gap: 0px; flex:3; }
        .panel-card { border-left:1px dashed #666; color: #ecf0f1; padding: 7px;  font-family: monospace; }
        .panel-card h4 { margin: 0 0 10px 0; color: #757d79; text-transform: uppercase; font-size: 0.8em; }

        table { border-collapse: collapse; width: 100%; table-layout: fixed; }
        th {  border: 1px solid #575757; padding: 2px; font-size: 0.8em; }
        td { border: 1px solid #3e3e3e; padding: 4px; text-align: center; }

        .addFreqButton {position:absolute;width:10px;height:10px;font-weight: bold; cursor: pointer ;right:0px; color:#9f9f9f;line-height: 10px; border:1px solid black; opacity: 0; }

        .addFreqButton:hover{border:1px solid grey;}
        
        .header-index { font-size: 1.2em; color: #858585; }
        .header-order { color: #6c6c6c; }
        .generator { background: #313131 !important; } 

        .cell-data { display: flex; flex-direction: column; gap: 4px; font-family: monospace; position:relative; }
        .cents { color: #6c6c6c; font-weight: bold; font-size: 0.85em; }
        .freq { color: #969696; font-weight: 600; font-size: .9em; }
        .mo { color: #9c9c9c; font-style: italic; font-size: 0.85em; }
        .empty-cell { color: #ccc; font-size: 0.75em; }

        .black {background-color: black;}

        canvas { background: #000; border: 1px solid #333; border-radius: none; width: 100%; height: 60px; }
        

        .keys { display: flex; gap: 8px; justify-content: center; margin-top: 20px; margin-bottom:20px; }
        .key { border: 1px solid #000;
                padding: 4px;
                width: 10px;
                text-align: center;
                font-size: 10px;
                font-weight: 900;
                background: #eeeeee;
                color: #666;
                height: 10px;
                transition: 0.05s;
                font-family: monospace; }
        .key.active { background: black; color: white; transform: scale(0.95); box-shadow: 0 0 15px rgba(123, 123, 123, 0.4); }

        .component-card { background: #eeeeee;
            border-left: 4px solid black;
            padding: 5px;
            display: flex;
            grid-template-columns: 1.5fr 1fr 1fr 0.5fr;
            gap: 15px;
            align-items: center;
            border: 1px solid black;
            margin: 2px;
            color: #000; }

        .component-card label{color:#000;}
        #tuning-system label{color:#000; display:flex;align-items: center; margin-bottom:0px;}

        button { font-size:10px; background-color: #eee; border:1px solid black; cursor: pointer;}
        button:hover{background-color: grey;}
        .lbutton { font-size:10px; background-color: #eee; border:1px solid black; cursor: pointer;}
        .lbutton:hover{background-color: grey;}


        .midi-monitor {  border: 1px solid #444; }
        .midi-status { font-size: 0.7rem; color: #000; margin-bottom: 5px; text-transform: uppercase; }
        .midi-keys-scroll { overflow-x: clip; display: flex; gap: 1px; padding-bottom: 5px; background: #111; }
        .m-key { min-width: 10.65px; height: 20px; background:#eee; border-radius: 0; transition: 0.1s; position: relative; }
        .m-key.active { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
        .m-key::after { content: attr(data-note); position: absolute; bottom: 2px; left: 1px; font-size: 5px; color: #666; }

        .extra-synth{padding:5px; color:#999; border:1px solid #333;}

        label input[type="file"] {
    position: absolute;
    top: -10000px;
    opacity: 0;
  }
  .label, .lbutton {
    width: auto;
    border:1px solid #818181;

    color:#747474;
    font-family: 'Consolas', monospace;
    font-size: 9px;
    display: inline-block;
    padding:1px 5px;
  }

  .lbutton2 {
    width: auto;
    border:1px solid #aaa;
    background-color: #000;
    color:#aaa;
    font-family: 'Consolas', monospace;
    font-size: 9px;
    display: inline-block;
    padding:1px 5px;
  }

  .label:hover {
    color:#ccc;
    background-color: #333;
  }
  .label:active {
    background: #9fa1a0;
  }
  .label:invalid+span {
    color: #000000;
  }
  .label:valid+span {
    color: #ffffff;
  }

  .topbar label{margin:0px;}

  #preset-list{
    font-size:11px; font-family: monospace; background-color: #798e77; font-weight: bold; text-shadow: 0 0 black;
  }


  .arg {display: inline-block;}
  table {color:#ccc;}

  #argsContainer {padding: 0px 5px;
    display: inline-block;
    border: 1px dashed grey;
    margin: 0px;}

    #general-opts input[type="range"]{
        max-width: 59px;
    }

    .component-card input[type="range"]{
        max-width: 69px;
    }

    .extra-synth input[type="range"]{
        max-width: 40px;
    }

    .sscanfit td {padding:1px;}

    #freq-display { font-family: monospace;}


    </style>

    <style>
    
        input[type="range"] {
            appearance: none;
            background: transparent;
            cursor: pointer;
            width: auto;
            max-width: 100px;
        }


        input[type="range"]::-webkit-slider-runnable-track {
            background: #ddd;
            height: 6px;
            border:1px solid #888;
        }


        input[type="range"]::-moz-range-track {
            background: #ddd;
            height: 6px;
            border:1px solid #888;
        }

  
        input[type="range"]::-webkit-slider-thumb {
        appearance: none;
        margin-top: -5px; /* Centers thumb on track */
        background-color: rgb(101, 114, 101);
        height: 15px;
        width: 5px;
        }

        input[type="range"]::-moz-range-thumb {
        border: none;
        background-color: rgb(101, 114, 101);
        height: 15px;
        width: 5px;
        }

  
        input[type="checkbox"],
        input[type="radio"] {
            appearance: none;
            background-color: #798e77;
            margin: 0;
            font: inherit;
            color: currentColor;
            width: 13px;
            height: 13px;
            border: 1px solid black;
            display: inline-grid;
            place-content: center;
            cursor: pointer;
        }

        input[type="radio"] {
            border-radius: 50%;
        }

   
        input[type="checkbox"]::before,
        input[type="radio"]::before {
            content: "";
            width: 0.8em;
            height: 0.8em;
            transform: scale(0);
           
            box-shadow: inset 1em 1em black;
        }

        input[type="checkbox"]::before {
        
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }

        input[type="radio"]::before {
            border-radius: 50%;
        }

        input:checked::before {
        transform: scale(1);
        }

    </style>


</head>
<body>
<div class="app">

    <div class="topbar" style="display:flex;align-items: center; height: 20px; justify-content:space-between;">
        <div class="presets" style=" display:inline-block; padding:2px;">
            Presets: 
            <div style="display:inline-block;">
                <select id="preset-list" onchange="applyPreset();">
                </select>
            </div>
            <div style="display:inline-block;">
               <button style="position: relative;" onclick="openSavePreset(this);">Save New</button>
            </div>
            <div style="display:inline-block;vertical-align: text-bottom;">
                <label class="lbutton">
                    <input type="file" oninput="getFile(this)"/>
                    IMP
                </label>
                <a id="export-presets">
                    <button class="lbutton" >EXP</button>
                </a>
                
            </div>
        </div>
        <div>
            <span>æqvo</span>
            <button id="startBtn">Initialize Audio Engine</button>
        </div>
        <div class="calcs" style="margin-right:5px;">
            Table/calculators:
            <label>
                Group Generators  <input type="checkbox" checked id="showGenerators" onchange="toggleDisplay('tableGenerators')">
                Simultaneous approx <input type="checkbox" id="showSimult" onchange="toggleDisplay('tableFits')">
            </label>
        </div>
        
    </div>
    
    <div id="tableGenerators" style="display: block;">

        <div class="groups" style="margin-bottom: -5px;">

            <div class="controls">
                <div class="input-group">
                    <label>Divisions</label>
                    <input type="number" id="inputD" value="10" min="1" max="100" step="1">
                </div>

                <div class="input-group">
                    <label>Equave</label>
                    <input type="number" id="inputF" value="2" step="0.001" min="0" max="10" style="width:60px;">
                </div>

                <div class="input-group">
                    <label>Rows</label>
                    <input type="number" id="inputR" value="3" min="2" max="10" step="1">
                </div>

                <div class="input-group">
                    <label>Display Options</label>
                    <div class="checkbox-group">
                        <label class="checkbox-item"><input type="checkbox" id="showCents"> Cents</label>
                        <label class="checkbox-item"><input type="checkbox" id="showMO"> Millioctaves</label>
                    </div>
                </div>
                
            </div>
    
            <div class="info-panel">
                <div class="panel-card">
                    <h4>Step Metrics</h4>
                    <div id="stepInfo"></div>
                </div>
                <div class="panel-card">
                    <h4>Group Generators</h4>
                    <div id="coprimeList"></div>
                </div>
            </div>
    
        </div>
    
        <div style="overflow-x: auto; background:#000;padding:5px;">
            <table id="resultTable">
                <thead id="tableHead"></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>

    </div>

    <div id="tableFits" style="display:none; background-color: black; padding:5px; border-top:2px solid grey;">
        <div class="card">
            
            <div class="input-fit" style="display:inline-block;">
                <label>Equave:</label> <input type="number" id="baseInput" value="2" step="any">
                <label>Convergents:</label> <input type="number" id="depthInput" value="6" min="1">
                <label>Max Q (Scanning):</label> <input type="number" id="maxQ" value="100">
                <button onclick="calculate()">Run Analysis</button>
            </div>
            <div id="argsContainer">
                <div class="arg">
                    <label>Arg:</label> <input type="number" class="arg-input" value="3" step="any">
                    <button class="remove" onclick="removeInput(this)">×</button>
                </div>
                <div class="arg">
                    <label>Arg:</label> <input type="number" class="arg-input" value="5" step="any">
                    <button class="remove" onclick="removeInput(this)">×</button>
                </div>
            </div>
            <button onclick="addInput()">+ Add Argument</button>
        </div>
        
        <div class="card">
            <label style="font-size:.8em;color:#666;font-family: monospace;">Convergent Comparison</label>
            <div id="tableArea"></div>
        </div>
        
        <div class="card">
            <label style="font-size:.8em;color:#666;font-family: monospace;">Scanning Method: Top 10 Simultaneous Fits</label>
            <div id="scanResults" class="best-list"></div>
        </div>
    </div>

    <div id="synth-main" style="border-top:2px solid black;">

        <div style="display:flex;">
            <div class="components" style="flex:3; border-bottom:1px solid black">
                <!--div id="warning" class="warning"></div-->

                <div id="tuning-system" style="margin:10px;" class="optse">
                    
                    <div style="display:flex; align-items: center; border:1px dashed grey;gap:20px;">
                        <span>Tuning System</span>
                        <label id="ltuning-ed">
                            <input type="radio" name="ttype" checked onchange="setTuning();"> Equal Divisions: <input type="number" min="1" max="1000" step="1" id="tuning-divisions" value="10" onchange="setTuning();">
                             Equave: <input type="number" style="width:60px;" min="1" max="500" step=".001" id="tuning-equave" value="2" onchange="setTuning();"> LINKED<input type="checkbox" checked id="linked-equaves">

                        </label>
                        <div></div>
                        <label id="ltuning-cent" style="opacity: .5;">
                            <input type="radio" name="ttype" onchange="setTuning();"> Cents: <input type="number" min="1" max="2000" step="0.05" value="100" id="tuning-cents" onchange="setTuning();">
                        </label>                         
                    </div>
                </div>
               
                <div id="general-opts" style="margin:10px;">
                    <div style="display:flex; align-items: center; border:1px dashed grey;gap:0px;">
                        <div class="control-group">
                            <label>Attack</label>
                            <input style="width:80px" type="range" id="attack" min="0.01" max=".5" step="0.001" value="0.05">
                        </div>
                        <div class="control-group">
                            <label>Decay</label>
                            <input style="width:80px" type="range" id="decay" min="0.0" max=".5" step="0.01" value="0.1">
                        </div>
                        <div class="control-group">
                            <label>Sustain</label>
                            <input type="range" id="sustainG" min="0.01" max="1" step="0.01" value=".5"> 
                        </div>
                        <div class="control-group">
                            <label>Release</label>
                            <input style="width:80px" type="range" id="release" min="0.01" max="4" step="0.01" value="0.4" >
                        </div>
                        <div class="control-group">
                            <label>Relative</label>
                            <input type="range" id="relative-rel" min="0" max=".5" value="0" step="0.01">
                        </div>
                        <div class="control-group">
                            <label>F<sub>0</sub>  Gain</label>
                            <input type="range" id="fGain" min="0" max="1" step="0.1" value="1">
                        </div>
                        <div class="control-group" style="width:129px;">
                            <label><input type="checkbox" id="randomPhase" checked> Random Phase</label>
                        </div>
                        
                    </div>
                </div>
            
                <div style="display:flex; justify-content: space-between; align-items: center;">
                    <span>Frequency Components</span>
                    <button class="btn btn-add" onclick="addComponent()">+ ADD</button>
                </div>

                <div id="components-container" onchange="drawDissonance();">
                    
                
                </div>
            </div>

            <div class="black" style="flex:2;color:#666;">
                <div class="global-settings" style="border:1px dashed grey; padding:5px;">

                    <div>
                        <div class="extra-synth">
                            <div>
                                <label>Master Volume</label>
                                <input type="range" id="masterVol" min="0" max=".25" step="0.01" value="0.15" style="max-width:80px;">
                                <label>Base Hz [MIDI 69 - Keyb A]</label>
                            <input type="number" id="baseFreq" value="261.4" onchange="baseHz=this.value">
                            </div>
                        </div>

                    </div>

                    <div>
                        <div class="extra-synth">
                            <label>
                            Reverb:<input type="checkbox" id="reverbOn" onchange="reverbOn=this.checked;"> </label>
                            <label class="lbutton2">LOAD IR<input type="file" id="IRFile"></label>

                            <label>Dry</label>
                            <input type="range" id="rev-gain" min="0" max="1" step="0.1" value=".2" onchange="updateReverb();">
                                    | 
                            <label>RING
                                <input type="checkbox" id="ringOn" class="p-sub"></label>
            
                                <label>Hz</label>
                                <input type="number" id="ringFreq" class="t-freq" min="1" max="1000" value="5" step=".1">
                           
                                <label>+</label>
                                <input type="range" id="ringGain" class="t-gain" min="0" max="500" step="1" value="3">
                        </div>
                    </div>
                </div>
                

                <div style="display:flex; margin-left:6px; margin-top: 5px; flex-wrap: wrap;">
                    <div style="display: inline-block;">
                        <canvas id="dissonanceCanvas" width="285" height="80" style="width:285px; height:80px; display:block;"></canvas>
                        <canvas id="densityCanvas"  width="285" height="20" style="width:285px; height:20px; display: block;"></canvas>

                    </div>
                    <div style="display:inline-block; margin-left:5px;">
                        Dissonance Curve:<br/>
                        <label>E.D. Ruler: <input type="checkbox" id="tuning-ruler" checked  onchange="drawDissonance();"></label><br/>
                        <label>Cents Ruler <input type="checkbox" id="12edo-ruler" onchange="drawDissonance();"></label><br/>
                        <label>Range:<br/>Equave +<input type="number" value="0.1" step="0.01" min="0.01" max="10" id="dissRange" onchange="drawDissonance();"></label>
                    </div>
                </div>

                <div class="graphs" style="margin:10px;margin-top:2px;">
                    Analyser:
                    <div  style="display:flex;">
                        <div style="flex:1;">
                            <canvas id="oscilloscope"></canvas>
                            <label style="display:flex;align-items:center;">Time: <input type="checkbox" id="drawTime" onchange="drawTime=this.checked;draw();"></label>
                        </div>
                        <div style="flex:1;">
                            <canvas id="oscilloscope2"></canvas>
                            <label style="display:flex;align-items:center;">Frequency: <input type="checkbox" id="drawFreq" checked onchange="drawFreq=this.checked;draw2();"></label>
                        </div> 

                    </div>
                </div>
                
            </div>
        </div>

        <div class="synth-bot">
            <div style="position: relative;">
                <div class="extra-opts" style="position:absolute; left:10px; top:5px;" >
                    <input type="checkbox" id="colorCode" checked onchange="colors();"> Chroma <input style="width:50px;" type="range" id="chroma-base" onchange="colors();" value="0" min="0" max="1" step=".01">
                </div>
                <div>
                    <div class="keys" id="keyboard">
                        <div class="key" data-key="q">Q</div><div class="key" data-key="w">W</div><div class="key" data-key="e">E</div>
                        <div class="key" data-key="r">R</div><div class="key" data-key="t">T</div><div class="key" data-key="y">Y</div>
                        <div class="key" data-key="u">U</div><br/>
                        <div class="key" data-key="a">A</div><div class="key" data-key="s">S</div><div class="key" data-key="d">D</div>
                        <div class="key" data-key="f">F</div><div class="key" data-key="g">G</div><div class="key" data-key="h">H</div>
                        <div class="key" data-key="j">J</div><br/>
                        <div class="key" data-key="z">Z</div><div class="key" data-key="x">X</div><div class="key" data-key="c">C</div>
                        <div class="key" data-key="v">V</div><div class="key" data-key="b">B</div><div class="key" data-key="n">N</div>
                        <div class="key" data-key="m">M</div>
                    </div>
                </div>
                <div class="extra-opts" style="position:absolute; right:10px; top:5px;" >
                    <span id="freq-display">f<sub>0</sub> ----- Hz</span>
                </div>
            </div>

            <div class="midi-monitor">
                <div id="midiStatus" class="midi-status" style="display:inline-block;">MIDI: Scanning...</div> <div style="padding:0px 5px; float:right;"><button onclick="getMIDI();" style="font-size:8px;">SCAN MIDI</button></div>
                <div class="midi-keys-scroll" id="midiKeys"></div>
            </div>

        </div>

    </div>

</div>


<!--preset-->
<script>

let userpresets = [];


window.addEventListener("load", () => {
    //loadPresets();
    loadSettings();
    const savePresetButton = document.getElementById('export-presets');
    savePresetButton.addEventListener('click', function(){
        let jsn = JSON.stringify(userpresets);
        let blob = new Blob([jsn]);
        let url = URL.createObjectURL(blob);
        savePresetButton.href = url;
        savePresetButton.download = "aeqvo";//.JSON
    });
} )

//validate the preset type!!!todo
function getFile(elm){//import
    new Response(elm.files[0]).json().then(json =>{
        userpresets = json;
        localStorage.setItem("EXAEQUO-PRESET",JSON.stringify(userpresets));
        fillPresetList();
    }, err => {
        //not json
        console.log("That's not a preset.")
    });
}


async function loadSettings() {
  try {
    const storedSettings = await localStorage.getItem("AEQVO-PRESET");
    if (storedSettings) {
        userpresets = JSON.parse(localStorage.getItem("AEQVO-PRESET"));
        fillPresetList();
    } else {
        localStorage.setItem("AEQVO-PRESET",defaultPresets);
        userpresets = JSON.parse(localStorage.getItem("AEQVO-PRESET"));
        fillPresetList();
    }
  } catch (error) {
    console.error('Error loading settings:', error);
  }
}

function savePreset(n){

    let components = [];
    const componentsP = document.querySelectorAll('.component-card');

    componentsP.forEach(comp => {
        const count = parseInt(comp.querySelector('.p-count').value);
        if(count>0){
            const mult = parseFloat(comp.querySelector('.p-mult').value);
            const decay = parseFloat(comp.querySelector('.p-decay').value);
            const ggain = parseFloat(comp.querySelector('.p-gain').value);
            const sub = comp.querySelector('.p-sub').checked;
            let component = {
                "equave": comp.id==="equaveComponent"?true:false,
                "count": count,
                "mult":mult,
                "decay": decay,
                "gain": ggain,
                "sub": sub
            };
            components.push(component);
        }
    });

    let npreset = {
        "name":n,
        "tuningMode": GetTrueOne('ttype'),
        "tuningEquave": parseFloat(document.getElementById('tuning-equave').value),
        "tuningDivisions": parseInt(document.getElementById('tuning-divisions').value),
        "tuningCents": parseFloat(document.getElementById('tuning-cents').value),
        "linked": document.getElementById('linked-equaves').checked,
        "masterVolume": parseFloat(document.getElementById('masterVol').value),
        "baseFreq": parseFloat(document.getElementById('baseFreq').value),
        "ringOn": document.getElementById('ringOn').checked,
        "ringFreq": document.getElementById('ringFreq').value,
        "ringGain": document.getElementById('ringGain').value,
        "attack": parseFloat(document.getElementById('attack').value),
        "decay": parseFloat(document.getElementById('decay').value),
        "sustain": parseFloat(document.getElementById('sustainG').value),
        "release": parseFloat(document.getElementById('release').value),
        "relrel": parseFloat(document.getElementById('relative-rel').value),
        "fGain": parseFloat(document.getElementById('fGain').value),
        "randomPhase": document.getElementById('randomPhase').checked,
        "components": components
    }

    let exs = false;
    for(let i = 0;i<userpresets.length;i++){
        if(userpresets[i].name == n) {
            userpresets[i] = npreset;
            exs=true;
        }
    }
    if(!exs) userpresets.push(npreset);
    localStorage.setItem("AEQVO-PRESET",JSON.stringify(userpresets));
    fillPresetList();
}

<script>

//links
let globalStep = {"f":1,"c:":0,"m":0}; //freq, cents, mocts

function setTuning(){
    let ttype = GetTrueOne('ttype');
    if(ttype==0){
        let tE = parseFloat(document.getElementById('tuning-equave').value);
        let tD = parseInt(document.getElementById('tuning-divisions').value);

        let freq = Math.pow(tE,1/tD);

        globalStep.f = freq;
        globalStep.c = centsFromFreq(freq);
        globalStep.m = moctsFromFreq(freq);
    } else if(ttype==1){
        let tuningCents = parseFloat(document.getElementById('tuning-cents').value);

        let freq = freqFromCents(tuningCents)

        globalStep.f = freq;
        globalStep.c = tuningCents;
        globalStep.m = moctsFromFreq(freq);
    }


    function freqFromCents(cents){
        return 2**(cents/1200);
    }
    function centsFromFreq(freq){
        return Math.log2(freq)*1200;
    }
    function moctsFromFreq(freq){
        return Math.log2(freq)*1000;
    }

    colors();
    
    drawDissonance();
}

function continuedFraction(x, maxTerms = 10) {
    const terms = [];
    let value = x;

    for (let i = 0; i < maxTerms; i++) {
        const a = Math.floor(value);
        terms.push(a);
        const frac = value - a;
        if (frac === 0) break; // exact rational
        value = 1 / frac;
    }


    const convergents = [];
    let p0 = 1, q0 = 0; // previous previous
    let p1 = terms[0], q1 = 1; // previous

    convergents.push(`${p1}/${q1}`);

    for (let i = 1; i < terms.length; i++) {
        const a = terms[i];
        const p = a * p1 + p0;
        const q = a * q1 + q0;
        convergents.push(`${p}/${q}`);
        p0 = p1; q0 = q1;
        p1 = p;  q1 = q;
    }

    return { terms, convergents };
}

</script>

        const status = document.getElementById('midiStatus');
        const inputs = midiAccess.inputs.values();
        let deviceCount = 0;
        for (let input of inputs) {
            input.onmidimessage = handleMIDIMessage;
            deviceCount++;
        }
        status.innerText = deviceCount > 0 ? `MIDI: ${deviceCount} device(s) ready` : "MIDI: No devices found";

        const [command, note, velocity] = msg.data;

        if(note<20||note>107) return;
        
        if (command === 144 && velocity > 0) {
            const freqn = baseHz * (globalStep.f**(note-69));

        } else if (command === 128 || (command === 144 && velocity === 0)) {
            stopVoice(`midi-${note}`);
            document.getElementById(`m-note-${note}`).classList.remove('active');
            freqDisplay.innerHTML = "f<sub>0</sub> ----- Hz"
        }
    }

<script>
    
    const gcd = (a, b) => b === 0 ? a : gcd(b, a % b);

    const elements = {
        inputD: document.getElementById('inputD'),
        inputR: document.getElementById('inputR'),
        inputF: document.getElementById('inputF'),
        showCents: document.getElementById('showCents'),
        showMO: document.getElementById('showMO'),
        stepInfo: document.getElementById('stepInfo'),
        coprimeList: document.getElementById('coprimeList'),
        tableHead: document.getElementById('tableHead'),
        tableBody: document.getElementById('tableBody')
    };

    function updateTable() {
        const D = parseInt(elements.inputD.value) || 1;
        const R = parseInt(elements.inputR.value) || 2;
        const F = parseFloat(elements.inputF.value) || 2;
        const showCents = elements.showCents.checked;
        const showMO = elements.showMO.checked;


        let coprimes = [];
        for (let i = 1; i < D; i++) {
            if (gcd(i, D) === 1) coprimes.push(i);
        }
        elements.coprimeList.innerText = `[ ${coprimes.join(', ')} ]`;

        const totalCents = Math.log2(F) * 1200;
        const stepCents = totalCents / D;
        const fRatio = Math.pow(F, 1/D);
        const stepMO = (Math.log2(F) * 1000) / D;
        elements.stepInfo.innerHTML = `Step: ${stepCents.toFixed(2)}c | Ratio: ${fRatio.toFixed(6)} | MO: ${stepMO.toFixed(2)}`;


        let headHTML = "<tr>";
        for (let c = 0; c <= D; c++) {
            const currentGCD = gcd(c, D);

            const order = (c === 0 || c === D) ? 1 : D / currentGCD;
            const isGenerator = (order === D);
            
            headHTML += `<th class="${isGenerator ? 'generator' : ''}">
                <span class="header-index">k=${c}</span>
                <span class="header-order">Order: ${order}</span>
            </th>`;
        }
        headHTML += "</tr>";
        elements.tableHead.innerHTML = headHTML;

<script>
    function addInput() {
        const div = document.createElement('div');
        div.className = 'arg';
        div.innerHTML = `<label>Arg:</label> <input type="number" class="arg-input" value="1.5" step="any"> <button class="remove" onclick="removeInput(this)">×</button>`;
        document.getElementById('argsContainer').appendChild(div);
    }

    function removeInput(btn) {
        if(document.querySelectorAll('.arg-input').length > 1) btn.parentElement.remove();
    }

    // standard 1D cfc
    function get1D(target, depth) {
        let cf = [], x = target;
        for (let i = 0; i < depth; i++) {
            let a = Math.floor(x); cf.push(a);
            let rem = x - a;
            if (Math.abs(rem) < 1e-12) break;
            x = 1 / rem;
        }
        let convs = [], h2 = 0, h1 = 1, k2 = 1, k1 = 0;
        cf.forEach(a => {
            let h = a * h1 + h2; let k = a * k1 + k2;
            convs.push({p: h, q: k});
            h2 = h1; h1 = h; k2 = k1; k1 = k;
        });
        return convs;
    }


    function calculate() {
        const base = parseFloat(document.getElementById('baseInput').value);
        const depth = parseInt(document.getElementById('depthInput').value);
        const maxQ = parseInt(document.getElementById('maxQ').value);
        const inputs = Array.from(document.querySelectorAll('.arg-input')).map(i => parseFloat(i.value));
        const targets = inputs.map(v => Math.log(v) / Math.log(base));

        // 1
        let html = `<table class="sscanfit"><tbody>`;

        const allConvs = targets.map((t, idx) => {
            const c = get1D(t, depth);
            html += `<tr><td>log<sub>${base}</sub>(${inputs[idx]}) ≈ ${t.toFixed(6)}</td>`;
            for(let i=0; i<depth; i++) {
                let val = c[i] ? `${c[i].p}/${c[i].q}` : '-';

                let approx = c[i].p / c[i].q;
                let diff = (t - approx).toExponential(2);

                html += `<td>${val} <br><small>(${diff})</small></td>`;
            }
            html += `</tr>`;
            return c;
        });


        html += `</tbody></table>`;
        document.getElementById('tableArea').innerHTML = html;

        // scanning method
        const winners = [];
        for (let q = 1; q <= maxQ; q++) {
            let totalSqErr = 0;
            inputs.forEach(val => {
                let target = Math.log(val) / Math.log(base);
                let drift = Math.abs(Math.round(q * target) - (q * target));
                totalSqErr += Math.pow(drift, 2);
            });
            let rms = Math.sqrt(totalSqErr / inputs.length);
            winners.push({q, rms});
        }
   
        winners.sort((a,b) => a.rms - b.rms);
        let bhtml = `<table class="sscanfit"><tbody><tr><td>Q<br>Total RMS Error</td>`;
      
        winners.slice(0, 10).sort((a,b) => a.q - b.q).forEach(w => {
            bhtml += `<td>${w.q} <br><small> ${w.rms.toFixed(5)}</small></td>`;
        });
        bhtml += `</tr></tbody></table>`;
        document.getElementById('scanResults').innerHTML = bhtml;
    }
    calculate();

</script>

//rudimentary

function playVoice(id, freq, velocityScale = 1) {
    if (!audioCtx || activeVoices.has(id)) return;

    let vmaster = master*velocityScale;

    const voiceGain = audioCtx.createGain();
    voiceGain.gain.setValueAtTime(0, audioCtx.currentTime);



    //fundamental
    const oFreq = freq;
    const fOsc = audioCtx.createOscillator();
    const fOscGain = audioCtx.createGain();

    fOsc.type = 'sine';
    fOsc.frequency.value = oFreq;
    fOscGain.gain.value = fGain;//ayayay

    fOsc.connect(fOscGain);
    fOscGain.connect(voiceGain);
    fOsc.start(audioCtx.currentTime);
    
    const oscillators = [];
    oscillators.push([fOsc,0,fOscGain]);

    if(ring==true) ringAdd(fOsc,oscillators,audioCtx.currentTime);




    
    const components = document.querySelectorAll('.component-card');

    components.forEach(comp => {
        const count = parseInt(comp.querySelector('.p-count').value);
        if(count>0){
            const mult = parseFloat(comp.querySelector('.p-mult').value);
            const decay = parseFloat(comp.querySelector('.p-decay').value);
            const ggain = parseFloat(comp.querySelector('.p-gain').value);
            const sub = comp.querySelector('.p-sub').checked;

            for (let i = 0; i < count; i++) {
                const hFreq = freq * Math.pow(mult, (i+1)*(sub==true?-1:1));
                if (hFreq > 18000 || hFreq < 20) continue;

                const osc = audioCtx.createOscillator();
                const oscGain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = hFreq;
               
                oscGain.gain.value = Math.exp(-i * decay) *ggain;

                osc.connect(oscGain);
                oscGain.connect(voiceGain);
                
                const startTime = audioCtx.currentTime + (randomPhase ? Math.random() * 0.01 : 0);
                osc.start(startTime);
                oscillators.push([osc,i+1,oscGain]);

                //vibrato
                if(ring==true) ringAdd(osc, oscillators, startTime);
                
            }
        }
    });

    if(reverbOn==true && reverb!==0){
        voiceGain.connect(reverb);
        reverb.connect(revg);
    }
    

    voiceGain.connect(masterGain);
    voiceGain.gain.linearRampToValueAtTime(vmaster, audioCtx.currentTime + attack);
    voiceGain.gain.linearRampToValueAtTime(vmaster * sustain, audioCtx.currentTime + attack + decay);
    activeVoices.set(id, { voiceGain, oscillators });
}

function stopVoice(id) {
    if (!activeVoices.has(id)) return;
    const { voiceGain, oscillators } = activeVoices.get(id);

    const now = audioCtx.currentTime;
    //voiceGain.gain.cancelScheduledValues(now);
    //voiceGain.gain.setValueAtTime(voiceGain.gain.value, now);
    //voiceGain.gain.linearRampToValueAtTime(0, now + release);

    oscillators.forEach(o => {
        o[2].gain.cancelScheduledValues(now);
        o[2].gain.setValueAtTime(o[2].gain.value, now);

        let newrel = Math.exp(-(o[1]) * relrel) *release;
        
        o[2].gain.linearRampToValueAtTime(0, now + ( newrel ) );

        o[0].stop(now + release + 0.05);
        o[0].onended = () => { o[0].disconnect();};
    });
    activeVoices.delete(id);
  
}

    //oscillators.push(randomizerLFO)

<script>


//color coding,
//uses rgb based canonical attractors wheel R O Y G B V M
//baiscally, keeps rgb red-cyan, and green-magenta definitions as complementaries, but
//changes the yellow-blue axis, to 2 new, yellow-violet, orange-blue
//this is the simplest way to make a rough cyclical spectrum render in "log coordinates" without implementing CIE or any wavelenght xyz conversion... is still an rgb gradient, but proportionally more faithfull to perceptual complementaries(binocular color fusion /afterimage /color constancy)
//im just a color conspiranoid! hail rycv

const mainHueStops = [ //remap Hue wheel{ input, output }
        { input: 0,     hue: 0   }, 
        { input: 45, hue: 30  }, 
        { input: 90, hue: 60  }, 
        { input: 135,   hue: 120 }  ,
        { input: 180,     hue: 180 }, 
        { input: 225, hue: 240 }, 
        { input: 270, hue: 270 },  
        { input: 315,   hue: 300 },  
        { input: 360,   hue: 360 }  
    ];

// generic linear interpolation function
function getInterpolatedValue(inputValue, stops) {
    // edge cases for inputs outside the defined range
    /*if (inputValue <= stops[0].input) {return stops[0].hue;}
    if (inputValue >= stops[stops.length - 1].input) {return stops[stops.length - 1].hue;}*/
    let modh = inputValue%360;

    for (let i = 0; i < stops.length - 1; i++) {
        const stopA = stops[i];
        const stopB = stops[i + 1];

        if (modh >= stopA.input && modh <= stopB.input) {
            const t = (modh - stopA.input) / (stopB.input - stopA.input);
            // interpolation
            const interpolatedHue = stopA.hue + t * (stopB.hue - stopA.hue);
            return interpolatedHue;
        }
    }
    return 0; // fallback,.. should not be reached with ok input and stops
}

let bufferLength = 256;

const canvas = document.getElementById('oscilloscope');
const ctx = canvas.getContext('2d');

function draw() {
    if(!audioCtx || !drawTime) return;
    requestAnimationFrame(draw);
    
    const dataArray = new Uint8Array(bufferLength);
    analyser.getByteTimeDomainData(dataArray);
    
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#eeeeee';
    ctx.beginPath();

    const sliceWidth = canvas.width / bufferLength;
    let x = 0;
    for (let i = 0; i < bufferLength; i++) {
        const v = dataArray[i] / 128.0;
        const y = v * canvas.height / 2;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        x += sliceWidth;
    }
    ctx.lineTo(canvas.width, canvas.height / 2);
    ctx.stroke();
}

const canvas2 = document.getElementById('oscilloscope2');
const ctx2 = canvas2.getContext('2d');

function draw2() {
    if(!audioCtx||!drawFreq) return;

    const WIDTH = canvas2.width;
    const HEIGHT = canvas2.height;

    ctx2.fillStyle = 'rgb(0,0,0)';
    ctx2.fillRect(0,0,WIDTH,HEIGHT);

    var barWidth = (WIDTH / bufferLength) * 2.5;
    var barHeight;
    var x = 0;

    for(var i = 0; i < bufferLength; i++) {
        barHeight = dataArray2[i];

        ctx2.fillStyle = 'rgb('+ (barHeight+100) + ','+ (barHeight+100) + ','+ (barHeight+100) + ')';
        ctx2.fillRect(x, HEIGHT-barHeight/2, barWidth,barHeight/2);

        x += barWidth + 1;
    }
};

        componentsD.forEach(comp => {
            const count = parseInt(comp.querySelector('.p-count').value);
            if(count>0){
                const mult = parseFloat(comp.querySelector('.p-mult').value);
                const decay = parseFloat(comp.querySelector('.p-decay').value);
                const ggain = parseFloat(comp.querySelector('.p-gain').value);
                const sub = comp.querySelector('.p-sub').checked;

                for (let i = 0; i < count; i++) {
                    const hFreq = 1000 * Math.pow(mult, (i+1)*(sub==true?-1:1));
                  
                    const hamp = Math.exp((-i) * decay) *ggain*10.0;
                    freq.push(hFreq);
                    amp.push(hamp);
                }
            }
        });
        n=freq.length;
    }
    
    let alphas = [];
    let diss = [];

    const paddingX = 15; 
    const paddingY = 15;
    const drawWidth = width - (paddingX * 2);
    const drawHeight = height - (paddingY * 2) -8;

    function drawDissonance(){

        drawDensity();
        setFreqAndAmps();

        alphas = [];
        diss = [];
        
        for (let alpha = startint; alpha <= endint + 0.01; alpha += inc) {
            let d = 0;
            
            const g = freq.map(f => alpha * f);

            for (let i = 0; i < n; i++) {
                for (let j = 0; j < n; j++) {
                    const lij = Math.min(amp[i], amp[j]);
                    const fmin = Math.min(g[j], freq[i]);
                    const s = dstar / (s1 * fmin + s2);
                    const fdif = Math.abs(g[j] - freq[i]);
                    
                    const arg1 = a1 * s * fdif;
                    const arg2 = a2 * s * fdif;
                    // bounds
                    const exp1 = arg1 < -88 ? 0 : Math.exp(arg1);
                    const exp2 = arg2 < -88 ? 0 : Math.exp(arg2);

                    const dnew = lij * (c1 * exp1 + c2 * exp2);
                    d += dnew;
                }
            }
            alphas.push(alpha);
            diss.push(d);
        }

        const maxDiss = Math.max(...diss);
        const minDiss = Math.min(...diss);

        ctxD.clearRect(0, 0, width, height);
        ctxD.beginPath();
        ctxD.strokeStyle = '#ccc'; 
        ctxD.lineWidth = 1.5;
        ctxD.lineJoin = 'round';

        for (let k = 0; k < alphas.length; k++) {
            const x = paddingX + ((Math.log10(alphas[k]) - Math.log10(startint)) / (Math.log10(endint) - Math.log10(startint))) * drawWidth;
           
            const normalizedY = (diss[k] - minDiss) / (maxDiss - minDiss);
            const y = 10+ paddingY + drawHeight - (normalizedY * drawHeight);

            if (k === 0) {
                ctxD.moveTo(x, y);
            } else {
                ctxD.lineTo(x, y);
            }
        }
        
        ctxD.stroke();

        drawMainMarks();
        if(centRuler.checked) drawCentRuler();
        if(tuningRuler.checked)drawEde();

    }
    

    function drawMainMarks(){
        ctxD.fillStyle = 'white';        
        ctxD.font = '8px monospace';

        let unisonpos = paddingX + ((1 - startint) / (endint - startint)) * drawWidth;
        let eqpos = paddingX + ((equaveD - startint) / (endint - startint)) * drawWidth;

        ctxD.fillText ("1:1", unisonpos, 75);

        ctxD.fillText("1:"+equaveD, eqpos,75)
    }

    function drawEde(){
        ctxD.fillStyle = '#ccc';
        ctxD.font = '8px monospace';

        ctxD.lineWidth = 1.0;
        ctxD.strokeStyle = '#ccc';
        ctxD.beginPath();
    
        let mark = 1;
        let stepf = parseFloat(document.getElementById('tuning-equave').value)**(1/ parseFloat(document.getElementById('tuning-divisions').value) );

        let k = 1;

        while(mark<=endint){
            const pos = paddingX + ((Math.log10( (stepf**(k-1)) ) - Math.log10(startint)) / (Math.log10(endint) - Math.log10(startint))) * drawWidth;
            ctxD.fillText (k-1, pos+2, 10);
            ctxD.moveTo (pos,5);   ctxD.lineTo (pos,drawHeight+25);
            k++;
            mark*=stepf;
        }
        ctxD.stroke();
    }

    function drawCentRuler(){
        ctxD.fillStyle = "#666";
        ctxD.font = '8px monospace';

        ctxD.lineWidth = 1.0;
        ctxD.strokeStyle = '#666';
        ctxD.beginPath();

        let tuningCents = parseFloat(document.getElementById('tuning-cents').value);
        let stepf = 2**(tuningCents/1200);

        let mark = 1;
        //let stepf = 2**(1/12);
        let k = 1;

        while(mark<=endint){
    
            const pos = paddingX + ((Math.log10( (stepf**(k-1)) ) - Math.log10(startint)) / (Math.log10(endint) - Math.log10(startint))) * drawWidth;
            ctxD.fillText (k-1, 2+ pos, 20);
            ctxD.moveTo (pos,15);   ctxD.lineTo (pos,drawHeight+25);
            k++;
            mark*=stepf;
        }
        ctxD.stroke();
    }
    


    const canvasID = document.getElementById('densityCanvas');
    const ctxID = canvasID.getContext('2d');
    const widthI = canvasID.width;
    const heightI = canvasID.height;

    let pairs = [[1,1]]

    function intervalDensity(){
        pairs = [[1,1]];

        equaveD = parseFloat(document.getElementById('tuning-equave').value);
        drange = parseFloat(document.getElementById('dissRange').value);
        endint = equaveD + drange;

        const componentsD = document.querySelectorAll('.component-card');

        componentsD.forEach(comp => {
            const count = parseInt(comp.querySelector('.p-count').value);
            if(count>0){
                const mult = parseFloat(comp.querySelector('.p-mult').value);
                const decay = parseFloat(comp.querySelector('.p-decay').value);
                const ggain = parseFloat(comp.querySelector('.p-gain').value);
                const sub = comp.querySelector('.p-sub').checked;

                for (let i = 0; i < count; i++) {
                    const hFreq = 1 * Math.pow(mult, (i+1)*(sub==true?-1:1));
                    //if (hFreq > 18000 || hFreq < 20) continue;
                    const hamp = Math.exp((-i) * decay) *ggain*1.0;
                    pairs.push([hFreq,hamp])
                }
            }
        });
  
        let density = [];

        for(let i = 0; i<pairs.length; i++){
            let base = pairs[i][0];
            let binte = pairs[i][1];

            for(let j = 0; j<pairs.length; j++){
                let interval = base / pairs[j][0];
                let weight = binte + pairs[j][1];
                density.push([interval,weight]);
            }
        }
        return density;
    }

    function drawDensity(){

        let pars = intervalDensity();

        ctxID.clearRect(0, 0, widthI, heightI);
        ctxID.beginPath();
        ctxID.strokeStyle = '#ccc'; 
        ctxID.lineWidth = .5;
        ctxID.lineJoin = 'round';

        for (let k = 0; k < pars.length; k++) {
            let current = pars[k][0];
            if(current<startint||current>endint) continue;
        
            const x = paddingX + ((Math.log10(current) - Math.log10(startint)) / (Math.log10(endint) - Math.log10(startint))) * drawWidth;

            ctxID.shadowColor = 'white';
            ctxID.shadowOffsetX = 0;
            ctxID.shadowOffsetY = 0;
   
            ctxID.shadowBlur = 4;
            ctxID.moveTo(x, 0);
            ctxID.lineTo(x, 50);
 
        }
        ctxID.stroke();
    }

</script>
